# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# Unit tests: FIPS-197 known answers through the fw_aes_api.
fragment:
  tasks:
  - name: vectors-pkg
    uses: std.FileSet
    needs: [spl]
    with:
      type: systemVerilogSource
      include: [fw_aes_vectors_pkg.sv]

  - name: vectors-tb
    uses: std.FileSet
    needs: [vectors-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_vectors_tb.sv]

  - name: vectors-img-v0
    uses: hdlsim.vlt.SimImage
    needs: [vectors-tb]
    with:
      top: [fw_aes_vectors_tb]

  - name: vectors-run-v0
    uses: hdlsim.vlt.SimRun
    needs: [vectors-img-v0]

  # The same vectors on the `rtl` view (A0 XLS RTL, clocked).
  - name: vectors-rtl-tb
    uses: std.FileSet
    needs: [rtl-view, vectors-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_vectors_rtl_tb.sv]

  - name: vectors-img-rtl
    uses: hdlsim.vlt.SimImage
    needs: [vectors-rtl-tb]
    with:
      top: [fw_aes_vectors_rtl_tb]

  - name: vectors-run-rtl
    uses: hdlsim.vlt.SimRun
    needs: [vectors-img-rtl]

  # The same vectors on the `v3` view (stage-TLM from the A0 schedule).
  - name: vectors-v3-tb
    uses: std.FileSet
    needs: [v3-view, vectors-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_vectors_v3_tb.sv]

  - name: vectors-img-v3
    uses: hdlsim.vlt.SimImage
    needs: [vectors-v3-tb]
    with:
      top: [fw_aes_vectors_v3_tb]

  - name: vectors-run-v3
    uses: hdlsim.vlt.SimRun
    needs: [vectors-img-v3]

  # Cycle fidelity: v3 against rtl, same ops, equal clocks per op (item 9).
  - name: vectors-fid-tb
    uses: std.FileSet
    needs: [rtl-view, v3-view, vectors-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_fid_tb.sv]

  - name: vectors-img-fid
    uses: hdlsim.vlt.SimImage
    needs: [vectors-fid-tb]
    with:
      top: [fw_aes_fid_tb]

  - name: vectors-run-fid
    uses: hdlsim.vlt.SimRun
    needs: [vectors-img-fid]

  # Sim speed: rtl and v3 views, 400000 ops each (item 10).
  - name: vectors-speed-tb
    uses: std.FileSet
    needs: [rtl-view, v3-view, vectors-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_speed_tb.sv]

  - name: vectors-img-speed-rtl
    uses: hdlsim.vlt.SimImage
    needs: [vectors-speed-tb]
    with:
      top: [fw_aes_speed_tb]

  - name: vectors-run-speed-rtl
    uses: hdlsim.vlt.SimRun
    needs: [vectors-img-speed-rtl]

  - name: vectors-img-speed-v3
    uses: hdlsim.vlt.SimImage
    needs: [vectors-speed-tb]
    with:
      top: [fw_aes_speed_tb]
      defines: [FW_AES_SPEED_V3]

  - name: vectors-run-speed-v3
    uses: hdlsim.vlt.SimRun
    needs: [vectors-img-speed-v3]

  # CSR access test:the generated fw-hdl register model, by address.
  - name: csr-tb
    uses: std.FileSet
    needs: [fw-hdl.hdl.sv-src, reg-model]
    with:
      type: systemVerilogSource
      include: [fw_aes_csr_tb.sv]

  - name: csr-img
    uses: hdlsim.vlt.SimImage
    needs: [csr-tb]
    with:
      top: [fw_aes_csr_tb]

  - name: csr-run
    uses: hdlsim.vlt.SimRun
    needs: [csr-img]

  # CSR access test of the fw-aes-dma register model (item 14a1).
  - name: aes-dma-csr-tb
    uses: std.FileSet
    needs: [fw-hdl.hdl.sv-src, aes-dma-reg-model]
    with:
      type: systemVerilogSource
      include: [fw_aes_dma_csr_tb.sv]

  - name: aes-dma-csr-img
    uses: hdlsim.vlt.SimImage
    needs: [aes-dma-csr-tb]
    with:
      top: [fw_aes_dma_csr_tb]

  - name: aes-dma-csr-run
    uses: hdlsim.vlt.SimRun
    needs: [aes-dma-csr-img]

  # fw-aes-dma TL class: CSR target + own WB master, v3 view (item 14a2).
  - name: aes-dma-tb
    uses: std.FileSet
    needs: [aes-dma-tl, v3-view]
    with:
      type: systemVerilogSource
      include: [fw_aes_dma_tb.sv]

  - name: aes-dma-img
    uses: hdlsim.vlt.SimImage
    needs: [aes-dma-tb]
    with:
      top: [fw_aes_dma_tb]

  - name: aes-dma-run
    uses: hdlsim.vlt.SimRun
    needs: [aes-dma-img]

  # fw-aes driven by bus accesses through its Wishbone target (V0).
  - name: wb-tb
    uses: std.FileSet
    needs: [wb-target]
    with:
      type: systemVerilogSource
      include: [fw_aes_wb_tb.sv]

  - name: wb-img
    uses: hdlsim.vlt.SimImage
    needs: [wb-tb]
    with:
      top: [fw_aes_wb_tb]

  - name: wb-run
    uses: hdlsim.vlt.SimRun
    needs: [wb-img]

  # Scaling bench (item 11, PLAN 6.4.3): N engines, K active, 40000 ops total.
  # Task scale-run-<view>-n<N>k<K>.
  - name: scale-tb
    uses: std.FileSet
    needs: [rtl-view, v3-view, vectors-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_scale_tb.sv]

  - name: scale-img-rtl-n1k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=1, FW_AES_SCALE_K=1]

  - name: scale-run-rtl-n1k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-rtl-n1k1]

  - name: scale-img-rtl-n4k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=4, FW_AES_SCALE_K=1]

  - name: scale-run-rtl-n4k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-rtl-n4k1]

  - name: scale-img-rtl-n16k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=16, FW_AES_SCALE_K=1]

  - name: scale-run-rtl-n16k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-rtl-n16k1]

  - name: scale-img-rtl-n64k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=64, FW_AES_SCALE_K=1]

  - name: scale-run-rtl-n64k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-rtl-n64k1]

  - name: scale-img-rtl-n16k4
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=16, FW_AES_SCALE_K=4]

  - name: scale-run-rtl-n16k4
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-rtl-n16k4]

  - name: scale-img-rtl-n16k16
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=16, FW_AES_SCALE_K=16]

  - name: scale-run-rtl-n16k16
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-rtl-n16k16]

  - name: scale-img-v3-n1k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=1, FW_AES_SCALE_K=1, FW_AES_SCALE_V3]

  - name: scale-run-v3-n1k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-v3-n1k1]

  - name: scale-img-v3-n4k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=4, FW_AES_SCALE_K=1, FW_AES_SCALE_V3]

  - name: scale-run-v3-n4k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-v3-n4k1]

  - name: scale-img-v3-n16k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=16, FW_AES_SCALE_K=1, FW_AES_SCALE_V3]

  - name: scale-run-v3-n16k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-v3-n16k1]

  - name: scale-img-v3-n64k1
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=64, FW_AES_SCALE_K=1, FW_AES_SCALE_V3]

  - name: scale-run-v3-n64k1
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-v3-n64k1]

  - name: scale-img-v3-n16k4
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=16, FW_AES_SCALE_K=4, FW_AES_SCALE_V3]

  - name: scale-run-v3-n16k4
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-v3-n16k4]

  - name: scale-img-v3-n16k16
    uses: hdlsim.vlt.SimImage
    needs: [scale-tb]
    with:
      top: [fw_aes_scale_tb]
      defines: [FW_AES_SCALE_N=16, FW_AES_SCALE_K=16, FW_AES_SCALE_V3]

  - name: scale-run-v3-n16k16
    uses: hdlsim.vlt.SimRun
    needs: [scale-img-v3-n16k16]
