fragment:
  # System bench (plan §7.3): host + fw-wb-dma (class model) + memory + fw-aes,
  # all transaction level. fw-wb-dma sources come from deps/fw-wb-dma, a local
  # symlink to a clone (gitignored; see Q1).
  tasks:
  - name: dma-rdl-src
    uses: std.FileSet
    with:
      base: ../../deps/fw-wb-dma/src/rdl
      type: systemRDLSource
      include: [wb_dma_ch_regs.rdl, wb_dma.rdl]

  - name: dma-reg-model
    uses: rdl.Export
    needs: [dma-rdl-src]
    with:
      format: fw-hdl
      top: wb_dma_regs
      filename: wb_dma_reg_pkg.sv
      args: ["-P", "NUM_CH=4"]
      options:
        package-name: wb_dma_reg_pkg
        type-style: lexical

  - name: dma-spl
    uses: std.FileSet
    needs: [fw-hdl.hdl.sv-src, dma-reg-model, fw.proto.wb.files, fw.proto.gpio.files]
    with:
      base: ../../deps/fw-wb-dma/src/spl
      type: systemVerilogSource
      include: [wb_dma_spl_pkg.sv]
      incdirs: ["."]

  - name: bench-tb
    uses: std.FileSet
    needs: [wb-target, dma-spl]
    with:
      type: systemVerilogSource
      include: [fw_aes_bench_tb.sv]

  - name: bench-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-tb]
    with:
      top: [fw_aes_bench_tb]

  - name: bench-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-img]

  # The same bench on the `rtl` view (A0 XLS RTL); FW_AES_BENCH_RTL picks it.
  - name: bench-rtl-tb
    uses: std.FileSet
    needs: [wb-target, dma-spl, rtl-view]
    with:
      type: systemVerilogSource
      include: [fw_aes_bench_tb.sv]

  - name: bench-rtl-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-rtl-tb]
    with:
      top: [fw_aes_bench_tb]
      defines: [FW_AES_BENCH_RTL]

  - name: bench-rtl-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-rtl-img]

  # The same bench on the `v3` view (stage-TLM); FW_AES_BENCH_V3 picks it.
  - name: bench-v3-tb
    uses: std.FileSet
    needs: [wb-target, dma-spl, v3-view]
    with:
      type: systemVerilogSource
      include: [fw_aes_bench_tb.sv]

  - name: bench-v3-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-v3-tb]
    with:
      top: [fw_aes_bench_tb]
      defines: [FW_AES_BENCH_V3]

  - name: bench-v3-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-v3-img]

  # v3 with A1 (11 clk/op) and A2 (44 clk/op) timing (item 12b, src/arch).
  - name: bench-v3-a1-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-v3-tb]
    with:
      top: [fw_aes_bench_tb]
      defines: [FW_AES_BENCH_V3, FW_AES_V3_CLKS=11]

  - name: bench-v3-a1-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-v3-a1-img]

  - name: bench-v3-a2-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-v3-tb]
    with:
      top: [fw_aes_bench_tb]
      defines: [FW_AES_BENCH_V3, FW_AES_V3_CLKS=44]

  - name: bench-v3-a2-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-v3-a2-img]

  # v3 with A5 (masked S-box, 21 clk/op) timing (item 15a, src/arch/a5.yaml).
  - name: bench-v3-a5-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-v3-tb]
    with:
      top: [fw_aes_bench_tb]
      defines: [FW_AES_BENCH_V3, FW_AES_V3_CLKS=21]

  - name: bench-v3-a5-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-v3-a5-img]

  # fw-aes-dma (item 14a3, Q4 variant): the same 8 blocks, no external DMA.
  - name: bench-aesdma-tb
    uses: std.FileSet
    needs: [aes-dma-tl, v3-view]
    with:
      type: systemVerilogSource
      include: [fw_aes_dma_bench_tb.sv]

  - name: bench-aesdma-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]

  - name: bench-aesdma-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-img]

  # Item 14b: fw_aes_dma with fetch of block i+1 overlapped with AES op i.
  - name: bench-aesdma-ov-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_DMA_OVERLAP]

  - name: bench-aesdma-ov-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-ov-img]

  # Item 14c: 3-stage pipeline, AES op i beside (store i-1; fetch i+1).
  - name: bench-aesdma-pipe-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_DMA_PIPE]

  - name: bench-aesdma-pipe-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-pipe-img]

  # fw-aes-dma pipe with A1/A2 timing (item 12b): the bus picks the architecture.
  # Item 14d2: X1 at TL (-1 clk/op; contracts.md), serial and pipelined.
  - name: bench-aesdma-x1-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_X1]

  - name: bench-aesdma-x1-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-x1-img]

  - name: bench-aesdma-pipe-x1-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_DMA_PIPE, FW_AES_X1]

  - name: bench-aesdma-pipe-x1-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-pipe-x1-img]

  - name: bench-aesdma-pipe-a1-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_DMA_PIPE, FW_AES_V3_CLKS=11]

  - name: bench-aesdma-pipe-a1-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-pipe-a1-img]

  - name: bench-aesdma-pipe-a6-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_DMA_PIPE, FW_AES_V3_CLKS=6]

  - name: bench-aesdma-pipe-a6-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-pipe-a6-img]

  - name: bench-aesdma-pipe-a2-img
    uses: hdlsim.vlt.SimImage
    needs: [bench-aesdma-tb]
    with:
      top: [fw_aes_dma_bench_tb]
      defines: [FW_AES_DMA_PIPE, FW_AES_V3_CLKS=44]

  - name: bench-aesdma-pipe-a2-run
    uses: hdlsim.vlt.SimRun
    needs: [bench-aesdma-pipe-a2-img]
