# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# The fw-hdl class model views (V0, V3). `needs` order is compile order.
fragment:
  tasks:
  - name: fw-aes-api-pkg
    uses: std.FileSet
    needs: [aes-pkg]
    with:
      type: systemVerilogSource
      include: [fw_aes_api_pkg.sv]

  - export: spl
    uses: std.FileSet
    needs: [fw-aes-api-pkg]

  # fw-aes as a Wishbone target (transaction level): CSR block + an API view.
  - export: wb-target
    uses: std.FileSet
    needs: [spl, fw-hdl.hdl.sv-src, fw.proto.wb.files, reg-model]
    with:
      type: systemVerilogSource
      include: [fw_aes_wb_pkg.sv]
