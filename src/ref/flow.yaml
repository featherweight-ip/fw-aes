# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# The reference: aes_pkg (the SV port of XLS's AES, copied from fw-hdl
# examples/xls/aes) and, later, the A0 XLS RTL.
fragment:
  tasks:
  - name: aes-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include: [aes_pkg.sv]

  # ---- A0: the XLS RTL (PLAN §7), as fw-hdl examples/xls/aes builds it ----
  - name: a0-ir
    uses: fw.hdl.xls.IR
    needs: [aes-pkg]
    with:
      top: [aes_pkg::encrypt, aes_pkg::decrypt]

  - name: a0-rtl
    desc: A0, XLS codegen of aes_pkg::encrypt and ::decrypt (2 pipeline stages)
    uses: synth.xls.Codegen
    needs: [a0-ir]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  # ---- A0 numbers (item 6): ECP5 synthesis of the XLS RTL ----
  - name: a0-synth-ecp5
    desc: Yosys synth_lattice (ECP5) of A0 encrypt; stat.json
    uses: synth.yosys.Synth
    needs: [a0-rtl]
    with:
      target: ecp5
      # decrypt is left out: its Yosys run is OOM-killed at ~58 GB on a 60 GB
      # host (docs/design/baseline.md); encrypt takes ~320 s, 15 GB.
      top: aes_pkg__encrypt
      formats: [json]

  # ---- A0 equivalence (item 6c): unoptimized IR of aes_pkg::encrypt vs the
  # opt IR that codegen schedules. Encrypt only, in its own IR/Codegen pair,
  # since Equiv picks packages by top name and a0-rtl holds two. ----
  - name: a0-ir-enc
    uses: fw.hdl.xls.IR
    needs: [aes-pkg]
    with:
      top: [aes_pkg::encrypt]

  - name: a0-rtl-enc
    uses: synth.xls.Codegen
    needs: [a0-ir-enc]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  - name: a0-equiv
    desc: check_ir_equivalence of A0 encrypt, fw.hdl.xls.IR vs Codegen opt IR
    uses: synth.xls.Equiv
    needs: [a0-ir-enc, a0-rtl-enc]
    with:
      timeout_s: 600
      gate: false
