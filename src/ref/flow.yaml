# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# The reference: aes_pkg (the SV port of XLS's AES, copied from fw-hdl
# examples/xls/aes) and, later, the A0 XLS RTL.
fragment:
  tasks:
  - name: aes-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include: [aes_pkg.sv]

  # ---- A0: the XLS RTL (PLAN §7), as fw-hdl examples/xls/aes builds it ----
  - name: a0-ir
    uses: fw.hdl.xls.IR
    needs: [aes-pkg]
    with:
      top: [aes_pkg::encrypt, aes_pkg::decrypt]

  - name: a0-rtl
    desc: A0, XLS codegen of aes_pkg::encrypt and ::decrypt (2 pipeline stages)
    uses: synth.xls.Codegen
    needs: [a0-ir]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid
