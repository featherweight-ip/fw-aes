# Contract records for fw-aes-dma (docs/design/contracts.md, C1-C4), in the
# sidecar format read by fw.hdl.cosynth (python -m fw.hdl.cosynth contracts).
#
# A record names the channel/CSR it covers, who implements it (where it is
# *checked*: here the transactor fw_aes_dma_xtor) and which co-synthesis
# steps consume it (where it is *assumed*). Each clause has a `check`: a
# Verilog boolean over the transactor's ports and the `aux` signals, that must
# hold in every cycle after reset ($past/$stable allowed). `env` clauses are
# assumptions about the other side of the boundary (the free environment).
module: fw_aes_dma_xtor
params: {GATE_BUSY: 1, LOCK_MODE: 1}
clock: clk
reset: rst

# Checker state shared by all proofs (counts per block, latched values).
aux: |
  logic        inflight;      // AES ops started and not finished (0/1 by C1)
  logic [127:0] blk_q;        // block presented at the last aes_in_valid
  logic [255:0] key_q;
  logic [2:0]  rd_beats, wr_beats;
  logic        result_seen, first_op;
  logic [127:0] res_q;
  logic [31:0] src_q, dst_q;
  logic [15:0] nblk;
  always_ff @(posedge clk) begin
    if (rst) begin
      inflight <= 0; blk_q <= 0; key_q <= 0; rd_beats <= 0; wr_beats <= 0;
      result_seen <= 0; first_op <= 1; res_q <= 0; src_q <= 0; dst_q <= 0; nblk <= 0;
    end else begin
      if (!busy) begin src_q <= cfg_src; dst_q <= cfg_dst; nblk <= 0; rd_beats <= 0; wr_beats <= 0; first_op <= 1; result_seen <= 0; end
      if (aes_in_valid) begin inflight <= 1; blk_q <= aes_block; key_q <= aes_key; rd_beats <= 0; result_seen <= 0; first_op <= 0; wr_beats <= 0; end
      if (aes_out_valid && inflight) begin inflight <= 0; result_seen <= 1; res_q <= aes_out; end
      if (m_cyc && m_stb && m_ack && !m_we) rd_beats <= rd_beats + 1;
      if (m_cyc && m_stb && m_ack && m_we) begin
        wr_beats <= wr_beats + 1;
        if (wr_beats == 3) nblk <= nblk + 1;
      end
    end
  end

# Environment of the transactor (assumed in every proof).
env:
  - id: E.wb_ack
    text: "Wishbone slave acks only an active strobe, and one of ack/err"
    check: "(m_ack || m_err) -> (m_cyc && m_stb) && !(m_ack && m_err)"
  - id: E.aes_core
    text: "AES core (C2 implementer): one result per started op, not in the start cycle"
    check: "aes_out_valid -> (inflight && !aes_in_valid)"

contracts:
  - id: C1
    name: AES block in
    channel: {kind: ready_valid, valid: aes_in_valid, ready: "!inflight", data: [aes_block]}
    implemented_by: fw_aes_dma_xtor (DMA fetch)
    consumed_by: [X1, X3]
    clauses:
      - id: C1.one_in_flight
        text: "at most one block in flight (no new block while the core is busy)"
        check: "aes_in_valid -> !inflight"
      - id: C1.four_beats
        text: "a block is handed to the core only after its 4 read beats"
        check: "aes_in_valid -> rd_beats == 4"
      - id: C1.block_stable
        text: "the block (channel buffer) is not changed while the op is in flight"
        check: "inflight -> aes_block == blk_q"

  - id: C2
    name: AES block out
    channel: {kind: ready_valid, valid: aes_out_valid, ready: "1 (consumer reads after DONE)", data: [aes_out]}
    implemented_by: "AES view (assumed: E.aes_core); consumer side fw_aes_dma_xtor (DMA store)"
    consumed_by: [X3]
    clauses:
      - id: C2.store_after_result
        text: "no store beat before the block's result (DOUT read only after DONE)"
        check: "(m_cyc && m_stb && m_we) -> result_seen && !inflight"
      - id: C2.store_data
        text: "the 4 store beats carry the result, byte 0 in [31:24] of beat 0"
        check: "(m_cyc && m_stb && m_we) -> m_dat_o == 32'(res_q >> (7'd96 - {wr_beats[1:0], 5'b0}))"
      - id: C2.four_stores
        text: "4 store beats per result before the next block starts (1 result per block)"
        check: "aes_in_valid -> (first_op || wr_beats == 4)"

  - id: C3
    name: CSR key
    csr: [KEY0-7, CTRL.MODE]
    implemented_by: fw_aes_dma_xtor (CSR block)
    consumed_by: [X2, X5, X6]
    clauses:
      - id: C3.key_stable_busy
        text: "key at the core is not changed while BUSY (KEY writes dropped)"
        check: "(busy && $past(busy)) -> $stable(aes_key)"
      - id: C3.key_stable_op
        text: "key at the core equals the key at op start for the whole op"
        check: "inflight -> aes_key == key_q"
      - id: C3.mode_fixed
        text: "MODE is fixed after the first START"
        check: "($past(busy) || $past(done)) -> $stable(aes_key_width)"

  - id: C4
    name: DMA Wishbone master
    channel: {kind: wishbone_classic, cyc: m_cyc, stb: m_stb, ack: m_ack}
    implemented_by: fw_aes_dma_xtor (bus FSM)
    consumed_by: [X1, X3]
    # abc pdr timed out on C4.hold (frame 4, 240 s); k-induction instead.
    mode: prove
    depth: 8
    engine: smtbmc boolector
    clauses:
      - id: C4.stb_in_cyc
        text: "STB only inside CYC"
        check: "m_stb -> m_cyc"
      - id: C4.hold
        text: "address/data/we held while a strobe is not acked"
        check: "($past(m_stb && !m_ack && !m_err) && !$past(rst)) -> (m_stb && $stable(m_adr) && $stable(m_we) && $stable(m_dat_o))"
      - id: C4.cfg_stable_busy
        text: "SRC/DST/LEN not changed while BUSY"
        check: "(busy && $past(busy)) -> ($stable(cfg_src) && $stable(cfg_dst) && $stable(cfg_len))"
      - id: C4.no_bus_idle
        text: "no bus access when not BUSY"
        check: "!busy -> !m_cyc"

  # The address-order clauses of C4, as a separate task: abc pdr did not
  # converge on them in 10 min (16-bit block counter x 32-bit address adders),
  # so they are checked bounded (BMC, 40 cycles = 2 blocks + slack).
  - id: C4o
    name: DMA Wishbone master, address order
    channel: {kind: wishbone_classic, cyc: m_cyc, stb: m_stb, ack: m_ack}
    implemented_by: fw_aes_dma_xtor (bus FSM)
    consumed_by: [X1]
    mode: bmc
    depth: 40
    engine: smtbmc boolector
    clauses:
      - id: C4.read_addr
        text: "reads in address order: SRC + 16*block + 4*beat"
        check: "(m_stb && !m_we) -> m_adr == src_q + {nblk, 4'b0} + {rd_beats[1:0], 2'b0}"
      - id: C4.write_addr
        text: "writes in address order: DST + 16*block + 4*beat"
        check: "(m_stb && m_we) -> m_adr == dst_q + {nblk, 4'b0} + {wr_beats[1:0], 2'b0}"
