$schema: https://fvutils.github.io/ivpm/ivpm.schema.json

package:
  name: fw-aes
  version: "0.1.0"
  description: >-
    AES-128 written with fw-hdl at several abstraction views (V0 zero-time
    API, A0 XLS RTL, V3 stage-TLM), with a DMA system bench (multi-view HLS
    demo, plan §7).
  license: Apache-2.0
  default-dep-set: dev

  dep-sets:
  # What a consumer of the IP needs: fw-hdl and the Wishbone protocol kit.
  - name: use
    description: fw-hdl and the protocol kits; what a consuming project fetches.
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default-dev
    - name: fw-proto-wb
      url: https://github.com/featherweight-ip/fw-proto-wb.git
      dep-set: use

  # Building, verifying, synthesizing and benchmarking the IP.
  - name: dev
    description: The use set plus the bench DMA, flow libraries and tools.
    uses: [use]
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default-dev

    # System bench (plan §7.3): the Wishbone DMA that feeds the AES core.
    - name: fw-wb-dma
      url: https://github.com/featherweight-ip/fw-wb-dma.git
      dep-set: use

    # Registers: SystemRDL -> fw-hdl register block.
    - name: peakrdl-fw-hdl
      url: https://git.dvkit.org/featherweight-hdl/peakrdl-fw-hdl.git
      dep-set: default-dev
    - name: dv-flow-librdl
      url: https://git.dvkit.org/dv-flow/dv-flow-librdl.git
      dep-set: default-dev

    # Flow
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: dv-flow-libproject
      url: https://github.com/dv-flow/dv-flow-libproject.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-libhdltest
      url: https://github.com/dv-flow/dv-flow-libhdltest.git
      dep-set: default-dev
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
      dep-set: default-dev
    - name: dv-flow-libhdllint
      url: https://github.com/dv-flow/dv-flow-libhdllint.git
      dep-set: default-dev
    # Area and Fmax numbers (plan §7, §8 Ph0): Yosys synthesis, ECP5 P&R.
    - name: dv-flow-libsynth
      url: https://github.com/dv-flow/dv-flow-libsynth.git
      dep-set: default-dev

    # Tools
    - name: verilator
      src: gh-rls
      url: https://github.com/edapack/verilator-bin
      cache: true
    - name: yosys
      src: gh-rls
      url: https://github.com/edapack/yosys-bin
      cache: true
      dep-set: default
    # Target: ECP5 place and route.
    - name: nextpnr
      src: gh-rls
      url: https://github.com/edapack/nextpnr-bin
      cache: true
    # NOTE: fw-hdl's dfm plugin (packages/fw-hdl/python) is not at the repo
    # root, so ivpm does not install it. Install it once by hand:
    #   uv pip install --python packages/python/bin/python -e packages/fw-hdl/python
